name: build-and-update-manifest

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"

env:
  IMAGE: SEU_REGISTRY/hello-gitops

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no registry
        uses: docker/login-action@v3
        with:
          registry: SEU_REGISTRY
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build e push da imagem
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG
          echo "TAG=$TAG" >> $GITHUB_ENV

      # Passo que fecha o loop do GitOps: atualiza a tag da imagem
      # no manifest e commita. O ArgoCD/Flux detecta essa mudança
      # e sincroniza automaticamente no cluster.
      - name: Atualizar tag no deployment.yaml
        run: |
          sed -i "s|image: .*hello-gitops:.*|image: $IMAGE:$TAG|" k8s/deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add k8s/deployment.yaml
          git commit -m "ci: atualiza imagem para $IMAGE:$TAG"
          git push
